<section class="composer">
  <form method="post" action="{{ site.root }}post" enctype="multipart/form-data">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    {% include "_post_mode.html" %}
    <div class="composer-text">
      <textarea name="content" rows="4" placeholder="{% if post_kind == "photo" %}Add a caption (optional, Markdown)…{% else %}Write a post (Markdown)…{% endif %}"></textarea>
      <div class="composer-tools">
        <button type="button" class="linkbtn emoji-picker-trigger"
                data-emoji-mode="insert" aria-controls="emoji-picker"
                aria-haspopup="dialog" aria-expanded="false"
                title="insert emoji" aria-label="insert emoji" hidden>
          <i class="nf nf-md-emoticon_outline ui-icon" aria-hidden="true"></i>
        </button>
        {% set sticker_preview = null %}
        {% include "_sticker_controls.html" %}
      </div>
    </div>
    <div class="composer-row">
      <label>CW <input type="text" name="summary" placeholder="content warning"></label>
      <label class="cb"><input type="checkbox" name="sensitive" value="1"> sensitive</label>
      <label>visibility
        <select name="visibility">
          <option value="public">public</option>
          <option value="unlisted">unlisted</option>
          <option value="followers">followers-only</option>
          <option value="direct">direct</option>
        </select>
      </label>
    </div>
    <div class="composer-row">
      {% include "_attachment_upload.html" %}
      <button type="submit">{% if post_kind == "photo" %}Post photos{% else %}Post{% endif %}</button>
    </div>
    <a href="{{ site.root }}compose?kind={{ post_kind }}">Standalone composer</a>
  </form>
</section>
