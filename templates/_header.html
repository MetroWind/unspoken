<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ site.title }}</title>
<link rel="icon" href="{{ site.root }}static/favicon.ico"
      type="image/x-icon" sizes="16x16 32x32 48x48">
<link rel="icon" href="{{ site.root }}static/favicon.svg"
      type="image/svg+xml" sizes="any">
{% if exists("stylesheets") %}
{% for sheet in stylesheets %}
<link rel="stylesheet" href="{{ site.root }}themes/{{ sheet }}">
{% endfor %}
{% else %}
<link rel="stylesheet" href="{{ site.root }}static/style.css">
{% endif %}
</head>
<body>
<header class="topbar">
  <a class="brand" href="{{ site.root }}">{{ site.title }}</a>
  <nav class="nav">
    <a href="{{ site.root }}">timeline</a>
    <a href="{{ site.root }}search">search</a>
{% if logged_in %}
    <a href="{{ site.root }}bookmarks">bookmarks</a>
    <a href="{{ site.root }}u/{{ me.username }}">profile</a>
    <span class="nav-me">{{ me.handle }}</span>
    <form class="inline" method="post" action="{{ site.root }}logout">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <button type="submit" class="linkbtn">log out</button>
    </form>
{% else %}
    <a href="{{ site.root }}login">log in</a>
{% endif %}
  </nav>
</header>
<main>
{% if length(error) > 0 %}
<p class="error">{{ error }}</p>
{% endif %}
