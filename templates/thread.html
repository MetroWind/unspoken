{% include "_header.html" %}
<h1 class="page-title">thread</h1>
<div class="timeline thread">
{% for post in posts %}
  <div class="thread-row thread-depth-{{ post.thread_depth }}">
    <div class="thread-guides" aria-hidden="true">
{% for guide in post.thread_guides %}
      <span class="thread-guide thread-level-{{ guide.level }}{% if guide.branch %} branch{% endif %}{% if guide.last %} last{% endif %}"></span>
{% endfor %}
    </div>
{% if post.show_parent %}
    <a class="thread-parent" href="#p{{ post.parent_id }}">replying to {{ post.parent_handle }}</a>
{% endif %}
{% include "_post.html" %}
  </div>
{% endfor %}
</div>

{% if logged_in %}
<section class="composer reply">
  <h2>Reply</h2>
  <form method="post" action="{{ site.root }}post/{{ reply_to_id }}/reply">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <textarea name="content" rows="3"
              placeholder="Reply (Markdown)…">{{ reply_prefill }}</textarea>
    <div class="composer-tools">
      <button type="button" class="linkbtn emoji-picker-trigger"
              data-emoji-mode="insert" aria-controls="emoji-picker"
              aria-haspopup="dialog" aria-expanded="false"
              title="insert emoji" aria-label="insert emoji" hidden>
        <i class="nf nf-md-emoticon_outline ui-icon" aria-hidden="true"></i>
      </button>
    </div>
    <div class="composer-row">
      <label>visibility
        <select name="visibility">
          <option value="public">public</option>
          <option value="unlisted">unlisted</option>
          <option value="followers">followers-only</option>
          <option value="direct">direct</option>
        </select>
      </label>
      <button type="submit">Reply</button>
    </div>
  </form>
</section>
{% endif %}
{% include "_footer.html" %}
