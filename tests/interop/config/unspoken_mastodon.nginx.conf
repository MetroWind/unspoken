server {
    listen 443 ssl;
    server_name unspoken.test;
    ssl_certificate /certs/unspoken.crt;
    ssl_certificate_key /certs/unspoken.key;
    client_max_body_size 16m;

    location / {
        proxy_pass http://unspoken:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
